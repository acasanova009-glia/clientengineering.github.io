<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript" src="//libs.glia.com/axon.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 12px; 
      margin: 0; 
    }
    p { margin: 6px 0; font-size: 13px; }
    
    .badge {
      display: inline-block;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 10px;
    }
    .badge-vip { background: #ffd700; color: #5c4300; }
    .badge-standard { background: #e0e0e0; color: #444; }

    /* VIP Toggle Button */
    .vip-toggle-btn {
      margin-left: 8px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #0070d2;
      background: #ffffff;
      color: #0070d2;
      cursor: pointer;
      vertical-align: middle;
      transition: all 0.2s ease;
    }
    .vip-toggle-btn:hover {
      background: #f0f7ff;
    }
    .vip-toggle-btn.is-active {
      background: #0070d2;
      color: #ffffff;
    }

    /* Main API Call Button */
    .action-btn { 
      width: 100%; 
      padding: 10px; 
      margin-top: 10px; 
      cursor: pointer; 
      background: #0070d2; 
      color: #fff; 
      border: none; 
      border-radius: 4px;
      font-weight: bold;
      transition: background 0.15s;
    }
    .action-btn:active { background: #005fb2; }

    .status-msg {
      margin-top: 6px;
      font-size: 11px;
      color: #0070d2;
      font-style: italic;
      min-height: 14px;
    }

    #result { 
      margin-top: 10px; 
      padding: 10px; 
      border-radius: 6px; 
      font-size: 13px; 
      background: #f4f4f4;
      border: 1px solid #ddd;
      word-break: break-word;
      font-weight: 500;
    }

    /* Dynamic Alert Styling */
    .alert-red {
      background: #ffebe6 !important;
      border: 1px solid #ff4d4f !important;
      color: #a8071a !important;
    }
    .alert-yellow {
      background: #fffbe6 !important;
      border: 1px solid #ffe58f !important;
      color: #874d00 !important;
    }
    .alert-blue {
      background: #e6f7ff !important;
      border: 1px solid #91d5ff !important;
      color: #0050b3 !important;
    }
    .score-tag {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.85;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <p><strong>Visitor ID:</strong> <span id="visitor-external-id">-</span></p>
  <p>
    <strong>Client Tier:</strong> 
    <span id="vip-status" class="badge badge-standard">Standard</span>
    <button id="toggle-vip-btn" class="vip-toggle-btn" type="button">Set as VIP</button>
  </p>
  <p><strong>Last Message:</strong> <span id="last-message">-</span></p>
  
  <button id="call-api-btn" class="action-btn">Evaluate & Call API</button>
  <div id="click-status" class="status-msg"></div>

  <div id="result">Ready</div>

  <script>
    const functionURL = 'https://api.beta.glia.com/integrations/294f888f-2d10-468f-9636-a2177e5a955d/endpoint';
    let lastMsgText = '';
    let isVip = false;
    let clickCount = 0;

    const vipEl = document.getElementById('vip-status');
    const toggleVipBtn = document.getElementById('toggle-vip-btn');

    // Updates badge text, colors, and button state
    function updateVipUI() {
      if (isVip) {
        vipEl.textContent = '★ VIP Client';
        vipEl.className = 'badge badge-vip';
        toggleVipBtn.textContent = 'Remove VIP';
        toggleVipBtn.classList.add('is-active');
      } else {
        vipEl.textContent = 'Standard';
        vipEl.className = 'badge badge-standard';
        toggleVipBtn.textContent = 'Set as VIP';
        toggleVipBtn.classList.remove('is-active');
      }
    }

    // Manual VIP toggle event listener
    toggleVipBtn.addEventListener('click', () => {
      isVip = !isVip;
      updateVipUI();
    });

    window.getGliaApi({ version: 'v1' }).then(glia => {
      // 1. Initial visitor info & VIP detection from customAttributes
      glia.addBufferedEventListener(glia.EVENTS.VISITOR, visitor => {
        const extId = visitor?.customAttributes?.external_id || '-';
        document.getElementById('visitor-external-id').textContent = extId;
        
        isVip = Boolean(visitor?.customAttributes?.is_vip);
        updateVipUI();
      });

      // 2. Track latest visitor message
      glia.addBufferedEventListener(glia.EVENTS.CHAT_MESSAGES, messages => {
        if (!Array.isArray(messages)) return;
        const lastMsg = messages.slice(-1)[0];
        if (lastMsg && lastMsg.sender?.type === 'visitor') {
          lastMsgText = typeof lastMsg.content === 'string' ? lastMsg.content : '';
          document.getElementById('last-message').textContent = lastMsgText || '(empty)';
        }
      });

      // 3. API Invocation Trigger
      const btn = document.getElementById('call-api-btn');
      const clickStatus = document.getElementById('click-status');
      const resultEl = document.getElementById('result');

      btn.onclick = async () => {
        clickCount++;
        clickStatus.textContent = `✓ Button clicked (${clickCount}x) — sending request...`;
        resultEl.className = '';
        resultEl.textContent = `Evaluating message with VIP = ${isVip}...`;

        try {
          const authHeaders = await glia.getRequestHeaders();
          const msgToSend = lastMsgText || "cancel";

          const payloadData = {
            message: msgToSend,
            text: msgToSend,
            is_vip: isVip
          };

          const res = await fetch(functionURL, {
            method: 'POST',
            headers: {
              ...authHeaders,
              'Content-Type': 'application/json',
              'Accept': 'application/json, application/vnd.salemove.v1+json'
            },
            body: JSON.stringify({
              ...payloadData,
              payload: JSON.stringify(payloadData)
            })
          });

          const rawText = await res.text();
          let data;
          try {
            data = JSON.parse(rawText);
          } catch {
            data = { message: rawText };
          }

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${data.errorMessage || data.message || rawText}`);
          }

          clickStatus.textContent = `✓ Evaluation complete at ${new Date().toLocaleTimeString()}`;

          // Format output message and style
          const alertMsg = data.message || JSON.stringify(data);
          let extraInfo = '';
          
          if (data.level !== undefined) {
            extraInfo = `<span class="score-tag">Tantrum Level: ${data.level}/10 | Sent as VIP: ${isVip ? 'Yes' : 'No'}</span>`;
          }

          resultEl.innerHTML = `${alertMsg} ${extraInfo}`;

            // Apply alert color based on response
            if (alertMsg.includes('🔴 ALERT')) {
            resultEl.className = 'alert-red';
            } else if (alertMsg.includes('🟡 ALERT')) {
            resultEl.className = 'alert-yellow';
            } else if (alertMsg.includes('🟢')) {
            resultEl.className = 'alert-green';
            } else if (data.type === 'quick_response') {
            resultEl.className = 'alert-blue';
            } else {
            resultEl.className = '';
            }

        } catch (err) {
          resultEl.className = 'alert-red';
          clickStatus.textContent = `✗ Request failed at ${new Date().toLocaleTimeString()}`;
          resultEl.textContent = 'Error: ' + err.message;
        }
      };
    });
  </script>
</body>
</html>
